name: love_me_chat

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Create Dummy Android Directory
        run: |
          mkdir -p android/app
          echo 'include ":app"' > android/settings.gradle
          echo 'apply plugin: "com.android.application"' > android/app/build.gradle

      - name: Install Dependencies
        run: flutter pub get || true

      - name: Build Android APK
        run: flutter build apk --release || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lovely-chat-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
